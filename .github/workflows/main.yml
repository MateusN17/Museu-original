name: Gerar APK Flet
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Flet e Dependencias
      run: |
        pip install flet
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk

    - name: Criar APK forcando o caminho do projeto
      run: |
        yes | flet build apk --module-name main Museu-original
